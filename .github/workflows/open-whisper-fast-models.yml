name: Fetch open Whisper support models

on:
  push:
    branches:
      - tmp/open-whisper-model-20260812
    paths:
      - .open-model/trigger-fast.txt

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download official open models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 5 --retry-all-errors \
            -o models/ggml-base-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin'
          curl -L --fail --retry 5 --retry-all-errors \
            -o models/ggml-tiny-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin'
          curl -L --fail --retry 5 --retry-all-errors \
            -o models/ggml-silero-v6.2.0.bin \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin'
          sha256sum models/* > models/SHA256SUMS.txt
          ls -lh models/

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-fast-models-and-vad
          path: models/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
