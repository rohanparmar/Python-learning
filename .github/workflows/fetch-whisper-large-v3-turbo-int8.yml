name: Fetch open Whisper Large v3 Turbo INT8

on:
  push:
    branches:
      - tmp/open-whisper-model-20260812
    paths:
      - .open-model/trigger-large-v3-turbo.txt

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download CTranslate2 INT8 model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'huggingface_hub>=0.30,<2'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Zoont/faster-whisper-large-v3-turbo-int8-ct2',
              local_dir='model',
              local_dir_use_symlinks=False,
          )
          PY
          rm -rf model/.cache
          find model -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          du -sh model
          sha256sum model/* > model/SHA256SUMS.txt

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-large-v3-turbo-int8
          path: model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
